<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Pied Piper Clean Icon Mark -->
  <g fill="#00E676">
    <!-- Feather sweeping up to top right -->
    <path d="M68,14 Q88,2 96,0 Q88,10 72,20 Z" />
    
    <!-- Pointed Hat -->
    <path d="M58,14 L72,22 L55,24 Z" />
    
    <!-- Profile Head -->
    <path d="M58,23 C62,24 66,27 64,32 C63,35 60,37 62,40 C64,42 68,39 72,36 L74,40 C68,44 62,46 58,42 C56,40 55,37 54,34 C53,31 52,28 58,23 Z" />
    
    <!-- Horizontal Pipe/Flute -->
    <path d="M22,38 L58,30 L59,34 L23,42 Z" stroke="#00E676" stroke-width="1.5" />

    <!-- Arms holding Pipe -->
    <path d="M46,34 C49,30 52,29 55,32 C53,35 50,36 46,34 Z" />
    <path d="M51,33 C54,30 58,30 60,33 L57,36 C55,34 53,34 51,33 Z" />

    <!-- Torso / Tunic -->
    <path d="M60,38 L63,62 C58,64 50,65 45,64 L44,45 C48,42 54,40 60,38 Z" />

    <!-- Belt -->
    <path d="M44,58 L62,55 L63,59 L44,61 Z" fill="#00A152" />

    <!-- Lower Tunic / Skirt -->
    <path d="M44,64 C51,65 59,63 63,62 L65,72 L45,74 Z" />

    <!-- Flowing Cape to the right -->
    <path d="M62,35 Q70,38 82,54 Q92,70 98,80 Q78,74 65,60 Z" />
  </g>
</svg>
