<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <!-- Exact Official Pied Piper Green Flute Player Silhouette with Text -->
  <g fill="#2B9337">
    <!-- Feather: sweeping from hat up to top right corner -->
    <path d="M310,165 Q390,130 475,25 C430,75 365,120 310,150 Z" />

    <!-- Hat -->
    <path d="M225,120 C240,95 285,70 310,120 L318,140 C280,140 240,145 210,175 C210,160 215,140 225,120 Z" />

    <!-- Long Pipe / Flute -->
    <rect x="15" y="235" width="220" height="24" rx="12" transform="rotate(-10, 125, 247)" />

    <!-- Profile Face -->
    <path d="M225,175 C215,185 220,205 230,215 L235,240 C245,260 270,265 295,255 L305,235 C285,225 270,200 255,180 C245,170 235,170 225,175 Z" />

    <!-- Arms -->
    <path d="M190,230 L220,220 L235,245 L200,260 Z" />
    <path d="M260,250 L140,235 L125,270 L245,290 L260,350 L300,340 L300,270 Z" />

    <!-- Cape -->
    <path d="M305,250 C330,260 380,310 405,380 C440,430 485,475 485,475 C420,445 385,385 360,345 C345,320 325,280 305,250 Z" />

    <!-- Tunic Waist & Belt Cutout -->
    <path d="M260,350 L340,325 L355,470 L260,475 Z" />

    <!-- Belt -->
    <path d="M260,390 L345,365 L347,380 L260,408 Z" fill="#FFFFFF" />

    <!-- Text: 'pied' -->
    <text x="30" y="540" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="110" fill="#2B9337" letter-spacing="-3">pied</text>

    <!-- Text: 'piper' -->
    <text x="80" y="640" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="110" fill="#2B9337" letter-spacing="-3">piper</text>
  </g>
</svg>
